
<div class="tarjeta">
  <h2>{{ videojoc.nom }}</h2>

  <p>Gènere: {{ videojoc.genere }}</p>

  <p>Preu: {{ preuText }}</p>

  <p>Puntuació: {{ videojoc.puntuacio }}/10</p>

  <p>Estat: {{ estat }}</p>

  <p>Any de llançament: {{ videojoc.anyLlancament }}</p>

  <p>Preu amb IVA: {{ preuAmbIVA.toFixed(2) }} €</p>

  <p>{{ etiqueta }}</p>
</div>
